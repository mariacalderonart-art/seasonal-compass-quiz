<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seasonal Compass Quiz</title>
</head>
<body>
<div id="seasonal-compass-quiz">
  <style>
    #seasonal-compass-quiz {
      --sc-spring: #A3C585;
      --sc-summer: #E8A93B;
      --sc-autumn: #D98C4A;
      --sc-winter: #8FB3D9;
      --sc-bg: #515839;
      --sc-surface: #5E6642;
      --sc-border: #6E7650;
      --sc-header: #C99939;
      --sc-text: #FFFFFF;
      --sc-text-muted: #D8D8CC;
      --sc-accent: #C99939;
      --sc-radius: 16px;
      --sc-shadow: 0 4px 20px rgba(0,0,0,0.18);

      max-width: 560px;
      margin: 0 auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--sc-text);
      background: var(--sc-bg);
      border-radius: var(--sc-radius);
      box-shadow: var(--sc-shadow);
      box-sizing: border-box;
      overflow: hidden;
    }
    #seasonal-compass-quiz * { box-sizing: border-box; }

    .sc-screen { display: none; padding: 32px 28px; flex-direction: column; align-items: center; }
    .sc-screen.sc-active { display: flex; }

    /* Landing screen */
    #sc-landing-screen { text-align: center; padding-top: 40px; padding-bottom: 40px; }
    .sc-logo {
      width: 100%;
      max-width: 460px;
      height: auto;
      display: block;
      margin-bottom: 32px;
    }
    .sc-landing-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 320px;
      margin: 0 auto 32px auto;
    }
    .sc-landing-heading {
      margin: 0;
      font-size: 32px;
      line-height: 1.15;
      color: var(--sc-header);
      font-weight: 700;
    }
    .sc-landing-sub {
      margin: 0;
      font-size: 15.5px;
      line-height: 1.6;
      color: var(--sc-text);
      opacity: 0.92;
    }
    .sc-start-btn {
      background: var(--sc-accent);
      color: #2E2A1A;
      border: none;
      border-radius: 99px;
      padding: 16px 44px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 24px;
      transition: opacity 0.15s ease;
    }
    .sc-start-btn:hover { opacity: 0.88; }
    .sc-dots { display: flex; justify-content: center; gap: 8px; }
    .sc-dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Quiz screen */
    #sc-quiz-screen { width: 100%; align-items: stretch; }
    .sc-progress-track {
      width: 100%;
      height: 6px;
      background: var(--sc-border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .sc-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sc-spring), var(--sc-summer), var(--sc-autumn), var(--sc-winter));
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .sc-question-count {
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--sc-header);
      margin-bottom: 8px;
      font-weight: 700;
    }
    .sc-question-text {
      font-size: 20px;
      line-height: 1.4;
      font-weight: 600;
      color: var(--sc-header);
      margin: 0 0 22px 0;
    }
    .sc-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .sc-option {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--sc-surface);
      border: 1.5px solid var(--sc-border);
      border-radius: 12px;
      padding: 15px 16px;
      min-height: 48px;
      font-size: 15px;
      line-height: 1.45;
      color: var(--sc-text);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
      font-family: inherit;
    }
    .sc-option:hover {
      border-color: var(--sc-accent);
      background: #666E48;
    }
    .sc-option:active { transform: scale(0.99); }
    .sc-back-btn {
      background: none;
      border: none;
      color: var(--sc-text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 8px 4px;
      font-family: inherit;
      align-self: flex-start;
    }
    .sc-back-btn:hover { color: var(--sc-text); }
    .sc-back-btn:disabled { visibility: hidden; }

    /* Results screen */
    #sc-results-screen { text-align: center; }
    .sc-results-eyebrow {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--sc-header);
      font-weight: 700;
      margin-bottom: 16px;
    }
    .sc-results-icon-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .sc-results-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .sc-results-season {
      margin: 0 0 4px 0;
      font-size: 30px;
      font-weight: 700;
      color: var(--sc-header);
    }
    .sc-results-tag {
      font-size: 14px;
      font-style: italic;
      color: var(--sc-text-muted);
      margin-bottom: 20px;
    }
    .sc-scorebar-wrap { width: 100%; margin-bottom: 20px; text-align: left; }
    .sc-scorebar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 12px;
    }
    .sc-scorebar-label { width: 52px; flex-shrink: 0; color: var(--sc-text-muted); font-weight: 600; text-align: left; }
    .sc-scorebar-track {
      flex: 1;
      height: 7px;
      background: var(--sc-border);
      border-radius: 99px;
      overflow: hidden;
    }
    .sc-scorebar-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; width: 0%; }
    .sc-results-desc {
      width: 100%;
      font-size: 14px;
      line-height: 1.6;
      color: var(--sc-text);
      background: var(--sc-surface);
      border-radius: 12px;
      padding: 18px 18px;
      text-align: left;
      margin-bottom: 22px;
      border: 1px solid var(--sc-border);
    }
    .sc-results-desc p { margin: 0; }
    .sc-results-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .sc-deepdive-btn, .sc-restart-btn {
      background: var(--sc-accent);
      color: #2E2A1A;
      border: none;
      border-radius: 99px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.15s ease;
      width: 100%;
      text-align: center;
    }
    .sc-deepdive-btn:hover, .sc-restart-btn:hover { opacity: 0.88; }

    @media (max-width: 480px) {
      .sc-screen { padding: 24px 18px; }
      #sc-landing-screen { padding-top: 32px; padding-bottom: 32px; }
      .sc-landing-heading { font-size: 26px; }
      .sc-question-text { font-size: 18px; }
      .sc-results-season { font-size: 26px; }
    }
  </style>

<script>
(function() {

  var SEASON_URLS = {
    Spring: "https://community.noamigrevemberg.com/c/spring",
    Summer: "https://community.noamigrevemberg.com/c/summer",
    Autumn: "https://community.noamigrevemberg.com/c/autumn",
    Winter: "https://community.noamigrevemberg.com/c/winter"
  };

  var seasonInfo = {
    Spring: {
      icon: "\uD83C\uDF31",
      color: "var(--sc-spring)",
      tag: "Awakening & Emergence",
      desc: "You're in Spring, a season of restless energy, new beginnings, and courageous uncertainty. This is a time of messy growth where you're learning to lean into discomfort and trust the unfolding process. Your journey invites you to honor your raw, imperfect emergence and to reach out for connection as you navigate this awakening."
    },
    Summer: {
      icon: "\u2600\uFE0F",
      color: "var(--sc-summer)",
      tag: "Expansion & Power",
      desc: "You're in Summer, a season of bold expression, fierce presence, and balancing your power with protection. You're called to show up fully, set boundaries, and engage deeply with your community. This season invites you to own your brilliance and rest when needed to sustain your flame."
    },
    Autumn: {
      icon: "\uD83C\uDF42",
      color: "var(--sc-autumn)",
      tag: "Realignment & Release",
      desc: "You're in Autumn, a season of deep realignment, letting go, and rebuilding your foundation. You're invited to soften into change, release what no longer serves, and prepare for renewal. This season asks you to embrace tension with courage and lean into shared strength."
    },
    Winter: {
      icon: "\u2744\uFE0F",
      color: "var(--sc-winter)",
      tag: "Rest & Renewal",
      desc: "You're in Winter, a season of profound rest, reflection, and gathering strength. You're called to honor your capacity, release burdens, and build resilience through surrender and support. This season invites you to slow down and trust the deep work of renewal."
    }
  };

  var SEASON_ORDER = ["Spring", "Summer", "Autumn", "Winter"];

  var questions = [
    {
      text: "How would you describe your current energy?",
      options: [
        { label: "Restless and shifting, like something new is stirring", season: "Spring" },
        { label: "Bright and full, ready to show up and expand", season: "Summer" },
        { label: "Reflective and ready to let go of what no longer serves", season: "Autumn" },
        { label: "Low and needing deep rest and renewal", season: "Winter" }
      ]
    },
    {
      text: "How comfortable are you with uncertainty right now?",
      options: [
        { label: "I want clear answers and plans", season: "Winter" },
        { label: "I'm uneasy but trying to be patient", season: "Autumn" },
        { label: "I feel curious and open to possibilities", season: "Spring" },
        { label: "I embrace uncertainty as part of growth", season: "Summer" }
      ]
    },
    {
      text: "Which feeling best describes your relationship with your body lately?",
      options: [
        { label: "Restless, like it's urging me to move or change", season: "Spring" },
        { label: "Energized but sometimes stretched too thin", season: "Summer" },
        { label: "Tense or heavy, signaling I need to release", season: "Autumn" },
        { label: "Tired or depleted, craving stillness and care", season: "Winter" }
      ]
    },
    {
      text: "How do you feel about your current social connections?",
      options: [
        { label: "Craving deeper connection but hesitant to reach out", season: "Spring" },
        { label: "Engaged but careful to protect my energy", season: "Summer" },
        { label: "Reassessing relationships and setting boundaries", season: "Autumn" },
        { label: "Seeking quiet support and space to heal", season: "Winter" }
      ]
    },
    {
      text: "What best describes your mindset about growth and change?",
      options: [
        { label: "Excited but uncertain about what's next", season: "Spring" },
        { label: "Ready to lead and express myself fully", season: "Summer" },
        { label: "Reflecting on what to release and realign", season: "Autumn" },
        { label: "Focused on rest, recovery, and rebuilding", season: "Winter" }
      ]
    },
    {
      text: "Which statement resonates most with you?",
      options: [
        { label: "I'm stepping into new beginnings, even if it feels messy", season: "Spring" },
        { label: "I'm balancing expansion with the need to protect myself", season: "Summer" },
        { label: "I'm letting go of old patterns to prepare for what's next", season: "Autumn" },
        { label: "I'm honoring my limits and embracing stillness", season: "Winter" }
      ]
    },
    {
      text: "What are you craving most right now?",
      options: [
        { label: "New experiences and adventure", season: "Spring" },
        { label: "To be seen, celebrated, and expressive", season: "Summer" },
        { label: "Simplicity, space, and fewer obligations", season: "Autumn" },
        { label: "Cocooning, quiet, and comfort", season: "Winter" }
      ]
    },
    {
      text: "If you had one free evening this week, what would you actually do with it?",
      options: [
        { label: "Try something completely new, on a whim", season: "Spring" },
        { label: "Host people or go out and be around energy", season: "Summer" },
        { label: "Journal, reflect, or have one honest conversation", season: "Autumn" },
        { label: "Go to bed early and do absolutely nothing", season: "Winter" }
      ]
    }
  ];

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Pre-shuffle each question's options once per quiz session
  var shuffledQuestions = questions.map(function(q) {
    return { text: q.text, options: shuffle(q.options) };
  });

  var current = 0;
  var answers = new Array(shuffledQuestions.length).fill(null);

  var landingScreen = document.getElementById("sc-landing-screen");
  var quizScreen = document.getElementById("sc-quiz-screen");
  var resultsScreen = document.getElementById("sc-results-screen");
  var startBtn = document.getElementById("sc-start-btn");
  var progressFill = document.getElementById("sc-progress-fill");
  var questionCount = document.getElementById("sc-question-count");
  var questionText = document.getElementById("sc-question-text");
  var optionsWrap = document.getElementById("sc-options");
  var backBtn = document.getElementById("sc-back-btn");

  function showScreen(el) {
    [landingScreen, quizScreen, resultsScreen].forEach(function(s) {
      s.classList.remove("sc-active");
    });
    el.classList.add("sc-active");
  }

  startBtn.addEventListener("click", function() {
    showScreen(quizScreen);
    renderQuestion();
  });

  function renderQuestion() {
    var q = shuffledQuestions[current];
    questionCount.textContent = "Question " + (current + 1) + " of " + shuffledQuestions.length;
    questionText.textContent = q.text;
    progressFill.style.width = (current / shuffledQuestions.length * 100) + "%";
    backBtn.disabled = current === 0;

    optionsWrap.innerHTML = "";
    q.options.forEach(function(opt) {
      var btn = document.createElement("button");
      btn.className = "sc-option";
      btn.type = "button";
      btn.textContent = opt.label;
      btn.addEventListener("click", function() {
        answers[current] = opt.season;
        if (current < shuffledQuestions.length - 1) {
          current++;
          renderQuestion();
        } else {
          showResults();
        }
      });
      optionsWrap.appendChild(btn);
    });
  }

  backBtn.addEventListener("click", function() {
    if (current > 0) {
      current--;
      renderQuestion();
    }
  });

  function showResults() {
    progressFill.style.width = "100%";

    var tally = { Spring: 0, Summer: 0, Autumn: 0, Winter: 0 };
    answers.forEach(function(s) { if (s) tally[s]++; });

    var maxVal = Math.max(tally.Spring, tally.Summer, tally.Autumn, tally.Winter);
    var winners = SEASON_ORDER.filter(function(s) { return tally[s] === maxVal; });

    var iconRow = document.getElementById("sc-results-icon-row");
    var seasonEl = document.getElementById("sc-results-season");
    var tagEl = document.getElementById("sc-results-tag");
    var descEl = document.getElementById("sc-results-desc");
    var buttonsEl = document.getElementById("sc-results-buttons");

    iconRow.innerHTML = "";
    descEl.innerHTML = "";
    buttonsEl.innerHTML = "";

    if (winners.length === 1) {
      // Clean single winner
      var season = winners[0];
      var info = seasonInfo[season];

      var iconDiv = document.createElement("div");
      iconDiv.className = "sc-results-icon";
      iconDiv.style.background = info.color;
      iconDiv.textContent = info.icon;
      iconRow.appendChild(iconDiv);

      seasonEl.textContent = season;
      tagEl.textContent = info.tag;

      var p = document.createElement("p");
      p.textContent = info.desc;
      descEl.appendChild(p);

      buttonsEl.appendChild(makeDeepDiveBtn(season));
      buttonsEl.appendChild(makeRestartBtn());

    } else if (winners.length === 4) {
      // Full four-way tie
      winners.forEach(function(s) {
        var iconDiv = document.createElement("div");
        iconDiv.className = "sc-results-icon";
        iconDiv.style.background = seasonInfo[s].color;
        iconDiv.style.width = "44px";
        iconDiv.style.height = "44px";
        iconDiv.style.fontSize = "20px";
        iconDiv.textContent = seasonInfo[s].icon;
        iconRow.appendChild(iconDiv);
      });

      seasonEl.textContent = "All Seasons at Once";
      tagEl.textContent = "The Full Turn";

      var p1 = document.createElement("p");
      p1.style.marginBottom = "10px";
      p1.textContent = "Right now you're not settled into one season — you're touching all four at once. Some restlessness, some fire, some release, some rest. That's not confusion. That's what it feels like to be at a genuine turning point, where every part of the cycle is present because you're not sure yet which direction you're moving.";
      var p2 = document.createElement("p");
      p2.textContent = "This is a good moment to sit with all four Field Guides rather than rushing to pick one — see which one you keep returning to.";
      descEl.appendChild(p1);
      descEl.appendChild(p2);

      winners.forEach(function(s) {
        buttonsEl.appendChild(makeDeepDiveBtn(s));
      });
      buttonsEl.appendChild(makeRestartBtn());

    } else {
      // Two-way or three-way tie
      winners.forEach(function(s) {
        var iconDiv = document.createElement("div");
        iconDiv.className = "sc-results-icon";
        iconDiv.style.background = seasonInfo[s].color;
        iconDiv.style.width = "52px";
        iconDiv.style.height = "52px";
        iconDiv.style.fontSize = "22px";
        iconDiv.textContent = seasonInfo[s].icon;
        iconRow.appendChild(iconDiv);
      });

      var namesJoined = joinSeasonNames(winners);
      seasonEl.textContent = "You're Between Seasons";
      tagEl.textContent = namesJoined;

      var p = document.createElement("p");
      p.textContent = "Right now you're not settled into just one season — you're carrying qualities of " + namesJoined + " at once. That's not indecision. It's a genuine in-between moment. Explore whichever Field Guide calls to you first.";
      descEl.appendChild(p);

      winners.forEach(function(s) {
        buttonsEl.appendChild(makeDeepDiveBtn(s));
      });
      buttonsEl.appendChild(makeRestartBtn());
    }

    var scorebarWrap = document.getElementById("sc-scorebar-wrap");
    scorebarWrap.innerHTML = "";
    SEASON_ORDER.forEach(function(season) {
      var row = document.createElement("div");
      row.className = "sc-scorebar-row";
      var pct = (tally[season] / shuffledQuestions.length) * 100;
      row.innerHTML =
        '<span class="sc-scorebar-label">' + season + '</span>' +
        '<div class="sc-scorebar-track"><div class="sc-scorebar-fill" style="width:0%; background:' + seasonInfo[season].color + ';"></div></div>';
      scorebarWrap.appendChild(row);
      setTimeout((function(rowEl, width) {
        return function() { rowEl.querySelector(".sc-scorebar-fill").style.width = width + "%"; };
      })(row, pct), 50);
    });

    showScreen(resultsScreen);
  }

  function joinSeasonNames(arr) {
    if (arr.length === 2) return arr[0] + " & " + arr[1];
    if (arr.length === 3) return arr[0] + ", " + arr[1] + " & " + arr[2];
    return arr.join(", ");
  }

  function makeDeepDiveBtn(season) {
    var a = document.createElement("a");
    a.className = "sc-deepdive-btn";
    a.href = SEASON_URLS[season];
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "Take a Deep Dive into " + season;
    return a;
  }

  function makeRestartBtn() {
    var btn = document.createElement("button");
    btn.className = "sc-restart-btn";
    btn.type = "button";
    btn.textContent = "Retake the Quiz";
    btn.addEventListener("click", function() {
      current = 0;
      answers = new Array(shuffledQuestions.length).fill(null);
      shuffledQuestions = questions.map(function(q) {
        return { text: q.text, options: shuffle(q.options) };
      });
      showScreen(landingScreen);
    });
    return btn;
  }

})();
</script>
</body>
</html>
